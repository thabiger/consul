name: custom-release

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch, tag, or SHA to build"
        required: true
      tag:
        description: "Release tag, e.g. custom-1.21.x-dns-locality-20260905"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version

      - name: Build linux binary
        run: make GOARCH=${{ matrix.goarch }} linux

      - name: Package artifact
        run: |
          mkdir -p dist
          artifact_base="consul_${{ inputs.tag }}_linux_${{ matrix.goarch }}"
          package_dir="dist/${artifact_base}"
          mkdir -p "${package_dir}"
          install -m 0755 "pkg/bin/linux_${{ matrix.goarch }}/consul" "${package_dir}/consul"
          cp LICENSE "${package_dir}/LICENSE.txt"
          cd dist
          zip -r "${artifact_base}.zip" "${artifact_base}"
          sha256sum "${artifact_base}.zip" > "${artifact_base}.zip.sha256"
          rm -rf "${artifact_base}"

      - uses: actions/upload-artifact@v4
        with:
          name: consul-linux-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body: |
            Unofficial Consul build from thabiger/consul.

            Includes custom DNS locality-aware lookup backport on release/1.21.x.

            This is not an official HashiCorp Consul release.
          files: |
            dist/*.zip
            dist/*.sha256
